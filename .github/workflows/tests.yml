name: tests

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, against the newest releases the ranges allow, to catch upstream breakage.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Only the lint extra: ruff needs none of the package's dependencies.
      - run: pip install "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["lint"][0])')"
      - run: ruff check --output-format=github .

  # An override of a method ADK marks final, or one whose signature drifted from ADK's.
  # Needs the package installed: pyright reads ADK's own source to know.
  overrides:
    name: ADK overrides
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install '.[types]'
      - run: pyright

  tests:
    name: tests (Python ${{ matrix.python-version }}, newest deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install --upgrade '.[test]'
      - run: pip check
      - run: pip freeze
      - run: pytest -q

  # Installs the lowest version each `>=` in pyproject.toml allows, so the floors are tested.
  lowest:
    name: tests (Python 3.13, lowest direct deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --resolution lowest-direct '.[test]'
      - run: uv pip check
      - run: uv pip freeze
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The wheel carries py.typed and the license files
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for wanted in ("harness/py.typed", "licenses/LICENSE", "licenses/NOTICE"):
              assert any(name.endswith(wanted) for name in names), f"{wanted} is not in the wheel"
          EOF
      - name: The wheel installs and imports outside the repo
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-env
          wheel-env/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          wheel-env/bin/pip check
          wheel-env/bin/python - <<'EOF'
          import pathlib, harness
          where = pathlib.Path(harness.__file__).parent
          assert "site-packages" in where.parts, where
          assert (where / "py.typed").is_file()
          print("imported", where)
          EOF
